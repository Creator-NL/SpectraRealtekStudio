name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore SpectraRealtekStudio.sln

    - name: Build Debug
      run: dotnet build SpectraRealtekStudio.sln -c Debug --no-restore

    - name: Build Release
      run: dotnet build SpectraRealtekStudio.sln -c Release --no-restore

    - name: Run Automated Unit Tests
      run: dotnet test SpectraRealtekStudio.sln -c Release --no-build --verbosity normal
